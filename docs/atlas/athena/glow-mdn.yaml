# Model section extracted from atlas_MDN_jz1234_v1-full_20260819-T212546/config.yaml.
# Paired checkpoint: epoch=076-val_loss=3.18772.ckpt
# Only matcher (training only) and scaler path changed.
model:
  class_path: hepattn.models.MaskFormer
  init_args:
    input_nets:
      class_path: torch.nn.ModuleList
      init_args:
        modules:
        - class_path: hepattn.models.InputNet
          init_args:
            input_name: node
            net:
              class_path: hepattn.models.Dense
              init_args:
                input_size: 18
                output_size: 256
                hidden_layers: null
                hidden_dim_scale: 2
                activation: null
                final_activation: null
                dropout: 0.0
                bias: true
                norm_input: false
            fields:
            - features
            posenc:
              class_path: hepattn.models.posenc.FourierPositionEncoder
              init_args:
                input_name: node
                dim: 256
                fields:
                - eta
                - phi
                scale: 0.1
            input_dtype: null
    encoder:
      class_path: hepattn.models.Encoder
      init_args:
        num_layers: 6
        dim: 256
        attn_type: flash-varlen
        window_size: null
        window_wrap: false
        score_mod: null
        value_residual: true
        num_register_tokens: 8
        attn_kwargs:
          num_heads: 16
        norm: LayerNorm
        layer_scale: null
        drop_path: 0.0
        hybrid_norm: true
        dense_kwargs: null
    decoder:
      class_path: hepattn.models.decoder.MaskFormerDecoder
      init_args:
        num_queries: 600
        decoder_layer_config:
          dim: 256
          hybrid_norm: true
          attn_kwargs:
            num_heads: 16
        num_decoder_layers: 4
        mask_attention: true
        use_query_masks: false
        log_attn_mask: false
        query_posenc: null
        preserve_posenc: false
    tasks:
      class_path: torch.nn.ModuleList
      init_args:
        modules:
        - class_path: hepattn.models.task.ObjectClassificationTask
          init_args:
            name: classification
            input_object: query
            output_object: pflow
            target_object: particle
            losses:
              object_ce: 2.0
            costs:
              object_ce: 2.0
            net:
              class_path: hepattn.models.Dense
              init_args:
                input_size: 256
                output_size: 6
                hidden_layers:
                - 256
                - 128
                - 32
                hidden_dim_scale: 2
                activation:
                  class_path: torch.nn.SiLU
                  init_args:
                    inplace: false
                final_activation: null
                dropout: 0.0
                bias: true
                norm_input: false
            num_classes: 5
            loss_class_weights:
            - 1.0
            - 3.0
            - 8.0
            - 1.5
            - 1.0
            null_weight: 0.5
            mask_queries: false
            has_intermediate_loss: true
        - class_path: hepattn.models.task.ObjectHitMaskTask
          init_args:
            name: mask
            input_hit: node
            input_object: query
            output_object: pflow
            target_object: particle
            losses:
              mask_bce: 5.0
              mask_dice: 1.0
            costs:
              mask_dice: 1.0
            dim: 256
            null_weight: 1.0
            mask_attn: true
            target_field: valid
            logit_scale: 4.0
            pred_threshold: 0.1
            focal_gamma: 2.0
            has_intermediate_loss: true
        - class_path: hepattn.models.task.IncidenceRegressionTask
          init_args:
            name: incidence
            input_hit: node
            input_object: query
            output_object: pflow
            target_object: particle
            losses:
              kl_div: 1.0
            costs:
              kl_div: 1.0
            net:
              class_path: hepattn.models.Dense
              init_args:
                input_size: 256
                output_size: 256
                hidden_layers:
                - 256
                - 256
                hidden_dim_scale: 2
                activation:
                  class_path: torch.nn.SiLU
                  init_args:
                    inplace: false
                final_activation: null
                dropout: 0.0
                bias: true
                norm_input: false
            node_net:
              class_path: hepattn.models.Dense
              init_args:
                input_size: 256
                output_size: 256
                hidden_layers:
                - 256
                hidden_dim_scale: 2
                activation: null
                final_activation: null
                dropout: 0.0
                bias: true
                norm_input: false
            has_intermediate_loss: false
        - class_path: hepattn.models.task.IncidenceBasedMixtureRegressionTask
          init_args:
            name: regression
            input_hit: node
            input_object: query
            output_object: pflow
            target_object: particle
            scale_dict_path: atlas_var_transform.yaml
            net:
              class_path: hepattn.models.Dense
              init_args:
                input_size: 518
                output_size: 8
                hidden_layers:
                - 512
                - 256
                - 128
                - 64
                - 32
                hidden_dim_scale: 2
                activation:
                  class_path: torch.nn.SiLU
                  init_args:
                    inplace: false
                final_activation: null
                dropout: 0.0
                bias: true
                norm_input: false
            cost_weight: 10.0
            use_nodes: true
            embedding_dim: 256
            has_intermediate_loss: false
            mdn_fields:
            - e
            - pt
            deterministic_fields:
            - eta
            - sinphi
            - cosphi
            num_components: 1
            mdn_loss_weight: 1.0
            deterministic_loss_weight: 60.0
            deterministic_loss_mode: l1
            mean_mode: offset
            scale_floor: 0.001
            initial_scale: 0.1
    dim: 256
    target_object: particle
    pooling: null
    matcher: null
    input_sort_field: null
    raw_variables:
    - node_e
    - node_pt
    - node_eta
    - node_sinphi
    - node_cosphi
    - node_is_track
