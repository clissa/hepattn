name: atlas_v1_nopart_gpu_inference
seed_everything: 20260616

data:
  inputs:
    hit:
      - "x"
      - "y"
      - "z"
      - "r"
      - "s"
      - "theta"
      - "phi"

  targets:
    particle:
      - e
      - pt
      - eta
      - sinphi
      - cosphi

  num_objects: &num_particles 450
  max_nodes: 160
  remove_wrong_idxs: true
  incidence_cutval: 0.01
  is_inference: true
  
  train_path: /fast_scratch_4/atlas/pflow/0pileup_JZ1-4_Run4_AOD_samples/partitions/GLOW/data//dijet_JZ1234_June2026_2000/train/JZ4_user.edreyer.50520201._000284.mltree_noseg.root
  valid_path: /fast_scratch_4/atlas/pflow/0pileup_JZ1-4_Run4_AOD_samples/partitions/GLOW/data/dijet_JZ1234_June2026_2000/val/JZ4_user.edreyer.50520201._000096.mltree_noseg.root
  # test_path: /fast_scratch_4/atlas/pflow/0pileup_JZ1-4_Run4_AOD_samples/partitions/GLOW/data/dijet_JZ1234_June2026_2000/test/JZ4_user.edreyer.50520201._000208.mltree_noseg.root
  test_path: /fast_scratch_4/atlas/pflow/0pileup_JZ1-4_Run4_AOD_samples/max/user.edreyer.801168.Py8EG_A14NNPDF23LO_jj_JZ3.recon.AOD.e8481_s4383_r17563_v12_mltree.root/user.edreyer.50520198._000249.mltree.root
  test_suff: baseline

  num_workers: 16
  num_train: -1
  num_test: -1
  num_val: -1

  batch_size: 64
  pin_memory: true

  scale_dict_path: &scale_dict_path configs/atlas_var_transform.yaml

trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 2
  precision: bf16-mixed
  gradient_clip_val: 0.1
  log_every_n_steps: 50
  default_root_dir: /home/lclissa/projects/hepattn/results/glow_baseline/atlas_v1_nopart_gpu_inference
  enable_progress_bar: True
  logger: false

  callbacks:
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        save_last: true
    - class_path: hepattn.experiments.atlas.PflowPredictionWriter
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 1

model:
  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.InputNet
            init_args:
              input_name: node
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 18
                  output_size: 256
                  hidden_layers: null
                  hidden_dim_scale: 2
                  activation: null
                  final_activation: null
                  dropout: 0.0
                  bias: true
                  norm_input: false
              fields:
              - features
              posenc:
                class_path: hepattn.models.posenc.FourierPositionEncoder
                init_args:
                  input_name: node
                  dim: 256
                  fields:
                  - eta
                  - phi
                  scale: 0.1
              input_dtype: null
      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 6
          dim: 256
          attn_type: flash-varlen
          window_size: null
          window_wrap: false
          score_mod: null
          value_residual: true
          num_register_tokens: 8
          attn_kwargs:
            num_heads: 16
          norm: LayerNorm
          layer_scale: null
          drop_path: 0.0
          hybrid_norm: true
          dense_kwargs: null
      decoder:
        class_path: hepattn.models.decoder.MaskFormerDecoder
        init_args:
          num_queries: 450
          decoder_layer_config:
            dim: 256
            hybrid_norm: true
            attn_kwargs:
              num_heads: 16
          num_decoder_layers: 4
          mask_attention: true
          use_query_masks: false
          log_attn_mask: false
          query_posenc: null
          preserve_posenc: false
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.task.ObjectClassificationTask
            init_args:
              name: classification
              input_object: query
              output_object: pflow
              target_object: particle
              losses:
                object_ce: 2.0
              costs:
                object_ce: 2.0
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 256
                  output_size: 6
                  hidden_layers:
                  - 256
                  - 128
                  - 32
                  hidden_dim_scale: 2
                  activation:
                    class_path: torch.nn.SiLU
                    init_args:
                      inplace: false
                  final_activation: null
                  dropout: 0.0
                  bias: true
                  norm_input: false
              num_classes: 5
              loss_class_weights:
              - 1.0
              - 3.0
              - 8.0
              - 1.5
              - 1.0
              null_weight: 0.5
              mask_queries: false
              has_intermediate_loss: true
          - class_path: hepattn.models.task.ObjectHitMaskTask
            init_args:
              name: mask
              input_hit: node
              input_object: query
              output_object: pflow
              target_object: particle
              losses:
                mask_bce: 5.0
                mask_dice: 1.0
              costs:
                mask_dice: 1.0
              dim: 256
              null_weight: 1.0
              mask_attn: true
              target_field: valid
              logit_scale: 4.0
              pred_threshold: 0.1
              has_intermediate_loss: true
          - class_path: hepattn.models.task.IncidenceRegressionTask
            init_args:
              name: incidence
              input_hit: node
              input_object: query
              output_object: pflow
              target_object: particle
              losses:
                kl_div: 1.0
              costs:
                kl_div: 1.0
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 256
                  output_size: 256
                  hidden_layers:
                  - 256
                  - 256
                  hidden_dim_scale: 2
                  activation:
                    class_path: torch.nn.SiLU
                    init_args:
                      inplace: false
                  final_activation: null
                  dropout: 0.0
                  bias: true
                  norm_input: false
              node_net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 256
                  output_size: 256
                  hidden_layers:
                  - 256
                  hidden_dim_scale: 2
                  activation: null
                  final_activation: null
                  dropout: 0.0
                  bias: true
                  norm_input: false
              has_intermediate_loss: false
          - class_path: hepattn.models.task.IncidenceBasedRegressionTask
            init_args:
              name: regression
              input_hit: node
              input_object: query
              output_object: pflow
              target_object: particle
              fields:
              - e
              - pt
              - eta
              - sinphi
              - cosphi
              loss_weight: 10.0
              cost_weight: 10.0
              scale_dict_path: configs/atlas_var_transform.yaml
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 518
                  output_size: 5
                  hidden_layers:
                  - 512
                  - 256
                  - 128
                  - 64
                  - 32
                  hidden_dim_scale: 2
                  activation:
                    class_path: torch.nn.SiLU
                    init_args:
                      inplace: false
                  final_activation: null
                  dropout: 0.0
                  bias: true
                  norm_input: false
              loss: l1
              use_incidence: true
              use_nodes: true
              has_intermediate_loss: false
              mode: offset
              cost: new
      dim: 256
      target_object: particle
      pooling: null
      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          adaptive_check_interval: 1000
          parallel_solver: true
          n_jobs: 16
          verbose: false
      input_sort_field: null
      raw_variables:
      - node_e
      - node_pt
      - node_eta
      - node_sinphi
      - node_cosphi
      - node_is_track
  lrs_config:
    initial: 1.0e-06
    max: 8.0e-05
    end: 1.0e-06
    pct_start: 0.03
    weight_decay: 0.0001
    skip_scheduler: false
  optimizer: Lion
  mtl: false

matmul_precision: highest
